name: Build BYPASSING RECOVERY APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'cloud-sync.js'
      - 'dashboard-accounts.js'
      - 'meta-connection.js'
      - 'verification-center.js'
      - 'recovery-assistant.js'
      - 'account-problem-scanner.js'
      - 'manifest.webmanifest'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/bypassing-recovery-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare app web assets
        run: |
          mkdir -p app/src/main/assets/public
          cp index.html style.css app.js cloud-sync.js dashboard-accounts.js meta-connection.js verification-center.js recovery-assistant.js account-problem-scanner.js app/src/main/assets/public/
          cp manifest.webmanifest icon-192.png icon-512.png app/src/main/assets/public/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYPASSING-RECOVERY-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
