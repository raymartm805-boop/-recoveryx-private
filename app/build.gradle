plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ippoxrecovery.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ippoxrecovery.app'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '1.0.7'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: 'missing-release-key.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: ''
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        debug {
            // Install alongside the existing app; does not replace or erase its data.
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
